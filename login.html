<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de login</title>
    <link rel="stylesheet" href="estilos/login.css" />
  </head>
  <body>
    <main>
      <article>
        <h1>SUA CONTA</h1>
        <form action="paginicial.html" method="post">
          <p id="email">
            <input
              type="email"
              name="usu"
              id="iusu"
              required
              placeholder="Email ou telefone"
              size="50"
            />
          </p>
          <p>
            <input
              type="password"
              name="en"
              id="isen"
              required
              minlength="8"
              placeholder="Senha"
              size="50"
            />
          </p>
          <p>
            <input id="botão" type="submit" value="ENTRAR" />
          </p>
          <p>
            <input id="botão2" type="submit" value="Esqueceu a senha?"  />
          </p>
        </form>
      </article>
    </main>
  </body>
</html>
